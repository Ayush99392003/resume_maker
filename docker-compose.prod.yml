version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: resume-maker-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - resume-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-maker-backend
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      - ENVIRONMENT=production
      - PORT=8001
      - WORKERS=${GUNICORN_WORKERS:-4}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SESSION_SECRET=${SESSION_SECRET:-change-this-in-production-use-a-strong-random-key}
      - REQUIRE_AUTH_FOR_SESSIONS=${REQUIRE_AUTH_FOR_SESSIONS:-true}
      - MAX_CONCURRENT_COMPILES=${MAX_CONCURRENT_COMPILES:-6}
      - PDF_CACHE_ENABLED=${PDF_CACHE_ENABLED:-1}
      - REDIS_URL=redis://redis:6379/0
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - MODEL_NAME=${MODEL_NAME:-openai/gpt-oss-120b}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    volumes:
      - resume-data:/app/backend/data
      - fontconfig-cache:/app/backend/data/fontconfig-cache
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - resume-network

  redis:
    image: redis:7-alpine
    container_name: resume-maker-redis
    restart: unless-stopped
    command: >
      redis-server 
      --save 60 1 
      --loglevel warning 
      --maxmemory 512mb 
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - resume-network

networks:
  resume-network:
    driver: bridge

volumes:
  resume-data:
    driver: local
  fontconfig-cache:
    driver: local
  redis-data:
    driver: local
