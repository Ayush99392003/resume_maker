version: '3.8'

services:
  resume-maker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume-maker-app
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - LOG_LEVEL=INFO
      - SESSION_SECRET=${SESSION_SECRET:-super-secret-default-key-change-in-prod}
      - REQUIRE_AUTH_FOR_SESSIONS=true
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - resume-data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  resume-data:
    driver: local
